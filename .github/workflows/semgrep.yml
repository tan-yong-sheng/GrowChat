name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Detect doc-only changes — skips expensive Semgrep analysis when only docs changed.
  # Uses the same inverted-logic pattern as guardrails.yml so any NEW file type
  # automatically triggers the scan. Only purely-doc PRs skip it.
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'

  semgrep:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@3e9d1ab13e81d95b4c49f8c7a5b4ba0e7a6d9d4e # v5.3.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python3 -m pip install semgrep
      - name: Run custom rules (blocking — ERROR severity only)
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --error \
            src public
      - name: Run security-audit scan (report-only)
        if: always()
        run: |
          semgrep scan \
            --config p/security-audit \
            --exclude-rule javascript.audit.detect-replaceall-sanitization.detect-replaceall-sanitization \
            --exclude-rule generic.html-templates.security.var-in-href.var-in-href \
            src public \
            --json \
            --output semgrep-report.json || true
      - name: Upload Semgrep report
        if: always() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: semgrep-report.json

  # Placeholder that reports success when Semgrep is skipped.
  # Required because "semgrep" is a required status check —
  # if the real job is skipped, GitHub won't see a passing status and blocks merge.
  semgrep-skip:
    name: semgrep
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No source changes detected — skipping Semgrep."
