name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python3 -m pip install semgrep
      - name: Run custom rules (blocking — ERROR severity only)
        # Temporarily excluding rules with known pre-existing violations.
        # Follow-up issue: #66 — fix violations and remove exclusions.
        run: |
          semgrep scan \
            --config .semgrep/rules.yml \
            --exclude-rule semgrep.no-raw-pill-button-markup-in-feature-code \
            --exclude-rule semgrep.no-direct-model-access-presentation-in-model-settings-features \
            --exclude-rule semgrep.no-inline-style-attributes-in-feature-code \
            --exclude-rule semgrep.no-raw-model-access-badge-markup-in-model-settings-features \
            --error \
            src public
      - name: Run security-audit scan (report-only)
        if: always()
        run: |
          semgrep scan \
            --config p/security-audit \
            --exclude-rule javascript.audit.detect-replaceall-sanitization.detect-replaceall-sanitization \
            --exclude-rule generic.html-templates.security.var-in-href.var-in-href \
            src public \
            --json \
            --output semgrep-report.json || true
      - name: Upload Semgrep report
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
