# PR Agent — Automated AI code review
# Uses PR-Agent (The-PR-Agent/pr-agent) with any OpenAI-compatible endpoint
# via CLIProxyAPI or direct provider.
#
# All configuration uses PR_AGENT_* prefix for clarity.
#
# Configuration (set in repo Settings > Secrets and variables > Actions):
#
# Secrets:
#   PR_AGENT_API_KEY        - Your OpenAI-compatible API key (sensitive, never exposed in logs)
#
# Variables (non-sensitive, visible in workflow logs):
#   PR_AGENT_BASE_URL       - Base URL of your OpenAI-compatible endpoint
#   PR_AGENT_MODEL           - Model ID to use for reviews
#                             Defaults to "gpt-5-mini" if not set
#   PR_AGENT_FALLBACK        - Comma-separated fallback models

name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skip drafts (review when marked ready)
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Run PR-Agent
      # Pinned to specific SHA for supply-chain safety.
      # Configured to use your custom OpenAI-compatible endpoint:
      #   CLIProxyAPI (router-for-me/CLIProxyAPI) or any OpenAI-compatible proxy
      #
      # PR-Agent uses Dynaconf config + litellm under the hood:
      #   - OPENAI_KEY           = your API key
      #   - OPENAI_API_BASE     = your base URL (used by litellm)
      #   - Model name           = set via PR_AGENT_MODEL repo var or PR_AGENT_* vars
      #
      # Note: The PR-Agent GitHub Action runner only reads OPENAI_KEY and
      # OPENAI_ORG from env. All other config (model, base URL) is set via
      # the repo's .pr_agent.toml config file or litellm's env var conventions.
      - name: Run PR-Agent
        id: pr-agent
        uses: The-PR-Agent/pr-agent@4263175b521a15b7dbe9caad6a60fe9803817aeb # v2026.07.01
        env:
          OPENAI_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI_API_BASE: ${{ vars.PR_AGENT_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Full output — includes review summary + inline comments
        # Available as step output for downstream processing
