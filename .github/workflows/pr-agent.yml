# PR Agent — Automated AI code review
# Uses PR-Agent (The-PR-Agent/pr-agent) with any OpenAI-compatible endpoint
# via CLIProxyAPI or direct provider.
#
# All configuration uses PR_AGENT_* prefix for clarity.
#
# Configuration (set in repo Settings > Secrets and variables > Actions):
#
# Secrets:
#   PR_AGENT_API_KEY        - Your OpenAI-compatible API key (sensitive, never exposed in logs)
#
# Variables (non-sensitive, visible in workflow logs):
#   PR_AGENT_BASE_URL       - Base URL of your OpenAI-compatible endpoint
#   PR_AGENT_MODEL           - Model ID to use for reviews
#                             Defaults to "gpt-5-mini" if not set
#   PR_AGENT_FALLBACK        - Comma-separated fallback models

name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [requested]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skip drafts (review when marked ready)
    if: >-
      github.event_name != 'pull_request_review' &&
      !github.event.pull_request.draft

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Run PR-Agent via Docker (official image)
      # Configured to use your custom OpenAI-compatible endpoint:
      #   CLIProxyAPI (router-for-me/CLIProxyAPI) or any OpenAI-compatible proxy
      #
      # Model name is passed via PR_AGENT_MODEL env var (repo variable)
      # Fallback models via PR_AGENT_FALLBACK (comma-separated)
      #
      # PR-Agent uses litellm under the hood:
      #   - OPENAI__API_BASE = your base URL
      #   - OPENAI__KEY     = your API key
      #   - model name      = PR_AGENT_MODEL (defaults to gpt-5-mini if not set)
      - name: Run PR-Agent
        id: pr-agent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_API_BASE: ${{ vars.PR_AGENT_BASE_URL }}
          OPENAI_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model config via env vars (double underscore = nested TOML key)
          # PR_AGENT__CONFIG__MODEL maps to [config] model in configuration.toml
          # PR_AGENT__CONFIG__FALLBACK_MODELS maps to [config] fallback_models
          PR_AGENT__CONFIG__MODEL: ${{ vars.PR_AGENT_MODEL || 'gpt-5-mini' }}
          PR_AGENT__CONFIG__FALLBACK_MODELS: ${{ vars.PR_AGENT_FALLBACK || 'gpt-4o-mini,gpt-4.1-nano' }}
          PR_AGENT__CONFIG__MAX_DESCRIPTION_TOKENS: '500'
          PR_AGENT__CONFIG__AI_TIMEOUT: '120'
          PR_AGENT__CONFIG__VERBOSITY_LEVEL: '0'
        # Full output — includes review summary + inline comments
        # Available as step output for downstream processing
