# PR Agent — Automated AI code review
# Uses the-pr-agent/pr-agent with a custom OpenAI-compatible endpoint.
#
# The runner reads OPENAI_KEY for auth and GITHUB_TOKEN for posting.
# The API base URL is set via OPENAI_API_BASE (used by litellm).

name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skip drafts (review when marked ready)
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # Run PR-Agent
      # Pinned to specific SHA for supply-chain safety.
      #
      # The PR-Agent GitHub Action runner reads these env vars:
      #   - OPENAI_KEY         = API key (from Secrets)
      #   - OPENAI_API_BASE   = Base URL (used by litellm for routing)
      #   - GITHUB_TOKEN       = GitHub API token (for posting comments)
      #   - PR_AGENT_CONFIG_BRANCH  = read .pr_agent.toml from PR branch
      #
      # The runner loads settings from the bundled configuration.toml
      # and optionally reads .pr_agent.toml from the config branch.
      # Set to main (the repo default branch) so merged config takes
      # effect. Not set to github.head_ref to prevent PR authors from
      # altering review behavior via their branch's .pr_agent.toml.
      #
      # When auto_* flags are unset, the runner invokes PRDescription,
      # PRReviewer, and PRCodeSuggestions by default.
      # See pr_agent/servers/github_action_runner.py:118-145.
      - name: Run PR-Agent
        id: pr-agent
        uses: The-PR-Agent/pr-agent@4263175b521a15b7dbe9caad6a60fe9803817aeb # v2026.07.01
        env:
          OPENAI_KEY: ${{ secrets.PR_AGENT_API_KEY }}
          OPENAI_API_BASE: ${{ vars.PR_AGENT_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: main
        # Full output — includes review summary + inline comments
        # Available as step output for downstream processing
