name: Design Guardrails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Detect whether design-related files changed.
  # Uses inverted logic so any new file type automatically triggers the gate —
  # only PRs with zero design-surface changes skip this workflow.
  changes:
    name: Detect design changes
    runs-on: ubuntu-latest
    outputs:
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            design:
              - 'DESIGN.md'
              - 'tailwind.config.js'
              - 'src/input.css'
              - 'public/index.html'
              - '.github/workflows/design-guardrails.yml'

  # Tier 1: @google/design.md structural lint — validates YAML frontmatter,
  # token references, component sub-tokens, and required prose sections.
  lint:
    name: design.md lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.design == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint DESIGN.md
        run: pnpm run lint:design

      # Future linting tools (vizzly, etc.) will be added as separate steps
      # within this same job, keeping the workflow flat and fast.

  # Placeholder that reports success when design guardrails are skipped.
  # Required because "design.md lint" is a required status check —
  # if the real job is skipped, GitHub won't see a passing status and blocks merge.
  lint-skip:
    name: design.md lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.design == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No design changes detected — skipping design guardrails."
