# Conditional Deploy — only runs wrangler deploy when deploy-relevant
# paths change. Skips on doc-only/safe-only changes.
#
# Uses dorny/paths-filter to detect which source paths actually changed.
# When no deploy-relevant paths exist, the deploy job is skipped.
#
# Also includes a placeholder-skip job so the required status check
# reports success (not "skipped" — GitHub blocks merge on skipped checks).

name: Conditional Deploy

on:
  push:
    branches:
      - main

# Cancel in-progress runs when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether deploy-relevant files changed.
  # Uses dorny/paths-filter with explicit path lists.
  # Only src/, migrations/, wrangler.jsonc, and package.json trigger
  # a real deploy. Pure doc-only changes (docs/, README.md, AGENTS.md)
  # skip entirely.
  #
  # IMPORTANT: This uses positive-filters (not predicate-quantifier).
  # If ANY of these paths match, deploy is needed. If NONE match,
  # the deploy job is skipped.
  changes:
    name: Detect deploy-relevant changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # 'some' — any matching path triggers deploy
          predicate-quantifier: 'some'
          filters: |
            deploy:
              - 'src/**'
              - 'migrations/**'
              - 'wrangler.jsonc'
              - 'package.json'
              # Explicitly NOT: docs/, README.md, AGENTS.md — those
              # are doc-only changes that never need a real deploy.
              # Also excluded by default: *.md, *.yml, *.yaml,
              # .editorconfig, .gitignore, LICENSE

  # Deploy to Cloudflare Workers — only when deploy-relevant paths change
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS
        run: pnpm run build:css

      - name: Validate migrations
        run: pnpm run validate:migrations

      - name: Ensure required secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          echo "Listing production secrets..."
          SECRETS_JSON=$(pnpm exec wrangler secret list --env production --format json)

          ensure_secret() {
            local name=$1
            local value=$2
            if node -e "
              const secrets = JSON.parse(process.stdin.read());
              process.exit(secrets.some((s) => s.name === '$name') ? 0 : 1);
            " <<< "$SECRETS_JSON"; then
              echo "$name is already set in the Cloudflare production environment."
              return
            fi
            if [ -z "$value" ]; then
              echo "::error::GitHub repository secret $name is not set. Add it at Settings > Secrets and variables > Actions > Repository secrets, then re-run this workflow."
              exit 1
            fi
            echo "Uploading $name to the Cloudflare production environment..."
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production
          }

          ensure_secret JWT_SECRET "$JWT_SECRET"
          ensure_secret RESEND_API_KEY "$RESEND_API_KEY"

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Post-deploy smoke test
        run: |
          echo "Running post-deploy smoke test..."
          HEALTH=$(curl -sS "https://chat.tanyongsheng.qzz.io/api/health")
          if ! echo "$HEALTH" | grep -q '"ok":true'; then
            echo "::error::Health check failed — response: $HEALTH"
            exit 1
          fi
          if ! echo "$HEALTH" | grep -q '"authConfigured":true'; then
            echo "::warning::JWT_SECRET may not be configured — deploy might have failed"
          fi
          echo "Post-deploy smoke test passed."

  # Placeholder that reports success when deploy is not needed.
  # Required because "Deploy to Cloudflare Workers" is a required
  # status check — if the real job is skipped, GitHub won't see
  # a passing status and blocks merge.
  deploy-skip:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'false'
    steps:
      - run: echo "No deploy-relevant changes — skipping wrangler deploy."
