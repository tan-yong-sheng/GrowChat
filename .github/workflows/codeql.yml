name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        if: ${{ !env.ACT }}
        with:
          category: '/language:${{ matrix.language }}'

      # Local-only scan (act): run CodeQL database analyze without SARIF upload
      - name: Local CodeQL Scan (act only)
        if: ${{ env.ACT }}
        run: |
          echo "Running CodeQL scan locally (act) — SARIF upload skipped"
          codeql database analyze /tmp/codeql_databases/javascript \
            --format=sarif-latest \
            --output=/tmp/results/javascript.sarif \
            || true
          echo "Local CodeQL scan complete"
