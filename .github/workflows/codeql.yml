name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # Detect doc-only changes — skips expensive CodeQL analysis when only docs changed.
  # Uses the same inverted-logic pattern as guardrails.yml so any NEW file type
  # automatically triggers the scan. Only purely-doc PRs skip it.
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          category: '/language:${{ matrix.language }}'

  # Placeholder that reports success when CodeQL is skipped.
  # Required because "CodeQL Analysis (javascript)" is a required status check —
  # if the real job is skipped, GitHub won't see a passing status and blocks merge.
  codeql-skip:
    name: CodeQL Analysis (javascript)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No source changes detected — skipping CodeQL Analysis."
