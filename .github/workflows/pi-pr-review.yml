# Pi Coding Agent - Automatic PR review
# Trigger: every new or updated pull request
# See: https://github.com/shaftoe/pi-coding-agent-action
#
# Required secrets (set in repo Settings > Secrets > Actions):
#   PI_API_KEY        - Your OpenAI-compatible provider API key
#
# Required variables (set in repo Settings > Variables > Actions):
#   PI_PROVIDER       - Custom provider name (must match models.json key)
#   PI_MODEL          - Model ID your endpoint serves
#   PI_BASE_URL       - Base URL of your OpenAI-compatible endpoint
#   PI_THINKING_LEVEL - (optional) "off" | "low" | "medium" | "high"

name: Pi PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Register custom OpenAI-compatible provider via models.json
      # Edit the values below to match your endpoint's actual specs
      - name: Configure custom LLM provider
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << EOF
          {
            "providers": {
              "${{ vars.PI_PROVIDER }}": {
                "baseUrl": "${{ vars.PI_BASE_URL }}",
                "apiKey": "${{ secrets.PI_API_KEY }}",
                "models": [{
                  "id": "${{ vars.PI_MODEL }}",
                  "name": "${{ vars.PI_MODEL }}",
                  "api": "openai-completions",
                  "reasoning": false,
                  "input": ["text"],
                  "contextWindow": 128000,
                  "maxTokens": 4096
                }]
              }
            }
          }
          EOF

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@v2.17.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ vars.PI_PROVIDER }}
          model: ${{ vars.PI_MODEL }}
          token: ${{ secrets.PI_API_KEY }}
          thinking_level: ${{ vars.PI_THINKING_LEVEL || 'off' }}
          diff_ignore_patterns: 'dist/ node_modules/ public/styles.css pnpm-lock.yaml coverage/'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with focus on:
            - Code quality and best practices
            - Potential bugs or logic errors
            - Security concerns (SQL injection, XSS, auth issues, supply chain attack, etc)
            - Performance considerations
            - Maintainability risks

            Workflow:
            1. Use `get_pr_diff` to analyze actual code changes and identify risky areas
            2. Use `get_issue_or_pr_thread` only if linked issues are needed for context

            Guidelines:
            - Focus only on high-confidence, actionable findings
            - Avoid style-only or trivial nitpicks
            - Use inline comments for specific code-level issues
            - Use `create_pull_request_review` for overall feedback
            - Only post GitHub review comments (do not return review text in messages)
