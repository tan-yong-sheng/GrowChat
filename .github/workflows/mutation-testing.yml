name: Mutation Testing

on:
  pull_request:
    paths:
      - 'src/**/*.js'
      - 'tests/**/*.js'
      - 'vitest.config.js'
      - 'stryker.config.json'
  workflow_dispatch:

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Stryker incremental
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation testing with threshold enforcement
        # Stryker exits non-zero when mutation score < thresholds.break (40%)
        # Thresholds configured in stryker.config.json: break=40, low=50, high=60
        run: pnpm run check:mutation

      - name: Report mutation score
        if: always()
        run: |
          echo "Mutation testing thresholds (stryker.config.json):"
          echo "  break: 40% (CI fails below this)"
          echo "  low: 50% (warning)"
          echo "  high: 60% (target)"
          echo ""
          echo "Check the HTML report in Stryker output for detailed scores."
