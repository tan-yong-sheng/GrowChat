name: Mutation Testing
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly full run: Sunday at midnight UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history needed for git diff origin/main on PRs
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR: incremental — use git diff to only mutate files changed since main
      - name: Run incremental mutation testing (PR)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'src/**/*.js' | grep -v '\.test\.js$' || true)
          CHANGED=$(printf '%s\n' "$CHANGED" | tr '\n' ',' | sed 's/,$//')
          if [ -z "$CHANGED" ]; then
            echo "No source files changed under src/, skipping mutation testing"
          else
            echo "Mutating changed source files: $CHANGED"
            pnpm run check:mutation -- --mutate "$CHANGED"
          fi

      # Schedule/dispatch: full run — all 203 source files
      - name: Run full mutation testing (weekly)
        if: github.event_name != 'pull_request'
        run: pnpm run check:mutation

      - name: Report mutation score
        if: always()
        run: |
          echo "Mutation testing mode: ${{ github.event_name == 'pull_request' && 'Incremental (changed files only)' || 'Full (all source files)' }}"
          echo ""
          echo "Thresholds (stryker.config.json):"
          echo "  break: 40% (CI fails below this)"
          echo "  low:   50% (warning)"
          echo "  high:  60% (target)"
          echo ""
          echo "Check the HTML report in Stryker output for detailed scores."
