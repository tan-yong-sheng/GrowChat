name: Visual Regression

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'public/**'
      - 'src/**'
      - 'DESIGN.md'
      - 'tests/e2e/frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'DESIGN.md'
      - 'tests/e2e/frontend/**'

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Initialize database
        run: |
          pnpm exec wrangler d1 migrations apply growchat --local
          pnpm exec wrangler d1 execute growchat --local --command \
            "INSERT OR REPLACE INTO app_config (key, value, updated_at) VALUES ('public_registration_status', 'active', unixepoch()), ('public_registration', 'true', unixepoch());"

      - name: Start dev server
        run: pnpm run dev &
        env:
          TEST_EMAIL: admin@localhost
          TEST_PASSWORD: admin123

      - name: Wait for server and seed test user
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health | grep -q 'ok'; then
              echo "Server ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 1
          done
          echo "Seeding test user..."
          curl -sf -X POST http://localhost:8787/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"Admin","email":"admin@localhost","password":"admin123"}' || true

      - name: Run visual regression tests
        run: |
          TEST_URL=http://localhost:8787 \
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:8787 \
          pnpm exec playwright test tests/e2e/frontend/visual-regression.spec.ts
        env:
          CI: true
          TEST_EMAIL: admin@localhost
          TEST_PASSWORD: admin123

      - name: Stop dev server
        if: always()
        run: |
          pkill -f "wrangler" || true
          pkill -f "vite" || true
          echo "Dev server stopped"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            tests/e2e/frontend/visual-regression.spec.ts-snapshots/
          retention-days: 7
