name: Visual Regression

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'public/**'
      - 'src/**'
      - 'DESIGN.md'
      - 'tests/e2e/frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'DESIGN.md'
      - 'tests/e2e/frontend/**'

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b243769053801afc1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc70378873ac3f83393a58495c9a
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783360180d183408
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm run dev &

      - name: Wait for server
        run: |
          for _ in {1..30}; do
            if curl -s http://localhost:8787/api/health | grep -q "ok"; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run visual regression tests
        run: |
          TEST_URL=http://localhost:8787 \
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:8787 \
          pnpm exec playwright test tests/e2e/frontend/visual-regression.spec.ts
        env:
          CI: true

      - name: Stop dev server
        if: always()
        run: |
          pkill -f "wrangler" || true
          pkill -f "vite" || true
          echo "Dev server stopped"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@65462500ed225dd9655b9867e53c6e83fecbacf4
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            tests/e2e/frontend/visual-regression.spec.ts-snapshots/
          retention-days: 7
