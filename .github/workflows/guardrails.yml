name: Main branch gate
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Semgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          pnpm run setup:semgrep

      - name: Setup Gitleaks
        run: |
          docker run --rm -v $PWD:/path ghcr.io/gitleaks/gitleaks:v8.30.0 detect --source /path --no-git --verbose

      # Tier 1 + Tier 2 guardrails (unit tests, typecheck, eslint incl. complexity,
      # semgrep, jscpd dupe budgets, depcruise circular deps, prettier, knip hygiene)
      - name: Pre-push gate
        run: pnpm run prepush

      # Tier 2: Vitest coverage thresholds (80% lines/branches/functions/statements)
      - name: Coverage threshold check
        run: pnpm run test:coverage

      # Tier 2: danger.js PR semantic checks
      - name: Run Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec danger ci

      # Tier 3: Code duplication audit (budget-enforced)
      - name: Code duplication audit
        run: pnpm run lint:dupes:budget

      # Tier 3: Performance regression audit
      - name: Performance regression audit
        run: pnpm run check:performance

      # Tier 3: Snapshot cleanup
      - name: Snapshot cleanup
        run: pnpm run snapshots:clean

      # Tier 3: Migration validation
      - name: Migration validation
        run: pnpm run validate:migrations

  # Tier 2: E2E accessibility gate (axe-core)
  # Uses a lightweight static server instead of wrangler dev (which requires D1 bindings)
  e2e-accessibility:
    name: E2E accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build CSS
        run: pnpm run build:css
      # Serve static assets on :8787 — no D1/KV bindings needed for a11y scans
      - name: Start static file server
        run: npx serve public -l 8787 &
      - name: Wait for server
        run: npx wait-on http://localhost:8787 --timeout 30000
      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/frontend/accessibility.spec.ts
        env:
          TEST_URL: http://localhost:8787
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8787
