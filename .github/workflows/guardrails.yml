name: Main branch gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Detect which source paths changed — used to skip heavy jobs on doc-only PRs.
  # Uses inverted logic (paths-ignore pattern) so any NEW file type automatically
  # triggers the full gate. Only purely-doc PRs skip validation.
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter-src.outputs.src }}
      ui: ${{ steps.filter-ui.outputs.ui }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter-src
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter-ui
        with:
          predicate-quantifier: 'some'
          filters: |
            ui:
              - 'public/**'
              - 'src/input.css'
              - 'tests/e2e/**'
              - 'tests/shared/**'
              - 'playwright.config.ts'
              - 'tailwind.config.js'

  checks:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.1.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Semgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install semgrep==1.167.0

      - name: Setup Gitleaks
        run: |
          docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:v8.30.0 detect --source /path --no-git --verbose

      # Tier 1 + Tier 2 guardrails (unit tests, typecheck, eslint incl. complexity,
      # fallow dupes, depcruise circular deps, prettier, fallow dead-code)
      # E2E is in its own job (see `e2e` job below) since it requires wrangler dev + DB.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-push gate (also runs E2E via test:e2e since prepush:checks includes it)
        timeout-minutes: 5
        run: pnpm run prepush:checks
        env:
          TEST_PORT: 8788
          TEST_EMAIL: admin@localhost
          TEST_PASSWORD: admin123
          TEST_URL: http://localhost:8788

      # Tier 2: Vitest coverage thresholds (currently 30% lines/branches/functions/statements; planned to increase)
      - name: Coverage threshold check
        timeout-minutes: 5
        run: pnpm run test:coverage

      # Tier 2: PR semantic checks
      # Replaces the previous `danger ci` invocation, which consistently
      # failed on this PR with ERR_STREAM_PREMATURE_CLOSE (node-fetch v2 +
      # gzipped GitHub API responses for large PRs). The custom check is
      # fully offline — it reads the PR body from a GitHub Actions env var
      # and runs `git diff --name-only` locally — so it has no third-party
      # network dependency.
      - name: Run PR checks
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # Prefix origin/ because actions/checkout creates the base branch
          # as origin/<ref>, not as a bare local ref.
          PR_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/pr-checks.js

      # Tier 3: Fallow codebase intelligence (unused code, duplication, complexity)
      - name: Fallow — dead code audit (baseline comparison — only new issues fail)
        run: pnpm run lint:hygiene

      - name: Fallow — regression baseline
        run: fallow dead-code --baseline .fallow/baseline.json --format json --quiet

      # Tier 3: Fallow — duplication budget
      - name: Fallow — duplication budget
        run: pnpm run lint:dupes:budget

      # Tier 3: Performance regression audit (with Lighthouse CI budget assertions)
      - name: Performance regression audit
        run: pnpm run check:performance

      # Tier 3: Snapshot budget audit (replaces cleanup-only step)
      - name: Snapshot budget audit
        run: pnpm run snapshots:audit

      # Tier 3: Migration validation
      - name: Migration validation
        run: pnpm run validate:migrations

  # Placeholder that reports success when guardrails are skipped.
  # Required because "Local + CI guardrails" is a required status check —
  # if the real job is skipped, GitHub won't see a passing status and blocks merge.
  guardrails-skip:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No source changes detected — skipping guardrails."

  # ── E2E suite ───────────────────────────────────────────────────────────────
  # Full E2E suite. The test-e2e.js wrapper starts its own wrangler dev + D1/KV,
  # waits for readiness, runs playwright, then tears the server down.
  # Runs on all push events (including main) and PRs with UI/e2e source changes.
  e2e:
    name: E2E (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full E2E suite (starts own wrangler dev on port 8788)
        run: pnpm run test:e2e
        env:
          TEST_PORT: 8788
          TEST_EMAIL: admin@localhost
          TEST_PASSWORD: admin123
          TEST_URL: http://localhost:8788

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Placeholder that reports success when the full E2E suite is skipped.
  # Required because "E2E (full suite)" is a required status check.
  e2e-skip:
    name: E2E (full suite)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No UI changes detected — skipping full E2E suite."

  # ── E2E accessibility ────────────────────────────────────────────────────────
  # Tier 2: E2E accessibility gate (axe-core)
  # Uses a lightweight static server instead of wrangler dev (which requires D1 bindings)
  e2e-accessibility:
    name: E2E accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build CSS
        run: pnpm run build:css

      # Serve static assets on :8787 — no D1/KV bindings needed for a11y scans
      - name: Start static file server
        run: npx serve public -l 8787 &

      - name: Wait for server
        run: npx wait-on http://localhost:8787 --timeout 30000

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/frontend/accessibility.spec.ts
        env:
          TEST_URL: http://localhost:8787
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8787

  # Placeholder for E2E accessibility when skipped
  e2e-accessibility-skip:
    name: E2E accessibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No UI changes detected — skipping E2E accessibility."
