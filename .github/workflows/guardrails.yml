name: Main branch gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Semgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          npm run setup:semgrep

      - name: Pre-push gate
        run: npm run prepush
