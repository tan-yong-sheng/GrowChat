name: Main branch gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter-src.outputs.src }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter-src
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'

  guardrails:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests (informational)
        continue-on-error: true
        run: pnpm run test

      - name: Fallow — dead code / hygiene
        run: pnpm run lint:hygiene

      - name: Fallow — duplication budget
        run: pnpm run lint:dupes

      - name: Fallow — security surface (informational)
        continue-on-error: true
        env:
          FALLOW_SECURITY_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: pnpm run lint:security

      - name: Fallow — feature flags
        run: pnpm run lint:flags

  guardrails-skip:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No source changes detected — skipping guardrails."
