name: Main branch gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Local + CI guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-push gate
        run: npm run prepush
