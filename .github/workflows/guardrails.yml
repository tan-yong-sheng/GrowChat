name: Main branch gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Detect which source paths changed — used to skip heavy jobs on doc-only PRs.
  # Uses inverted logic (paths-ignore pattern) so any NEW file type automatically
  # triggers the full gate. Only purely-doc PRs skip validation.
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!.editorconfig'
            ui:
              - 'public/**'
              - 'src/input.css'

  checks:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Semgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          pnpm run setup:semgrep

      - name: Setup Gitleaks
        run: |
          docker run --rm -v $PWD:/path ghcr.io/gitleaks/gitleaks:v8.30.0 detect --source /path --no-git --verbose

      # Tier 1 + Tier 2 guardrails (unit tests, typecheck, eslint incl. complexity,
      # semgrep, jscpd dupe budgets, depcruise circular deps, prettier, knip hygiene)
      - name: Pre-push gate
        run: pnpm run prepush

      # Tier 2: Vitest coverage thresholds (80% lines/branches/functions/statements)
      - name: Coverage threshold check
        run: pnpm run test:coverage

      # Tier 2: danger.js PR semantic checks
      - name: Run Danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec danger ci

      # Tier 3: Code duplication audit (budget-enforced)
      - name: Code duplication audit
        run: pnpm run lint:dupes:budget

      # Tier 3: Performance regression audit
      - name: Performance regression audit
        run: pnpm run check:performance

      # Tier 3: Snapshot cleanup
      - name: Snapshot cleanup
        run: pnpm run snapshots:clean

      # Tier 3: Migration validation
      - name: Migration validation
        run: pnpm run validate:migrations

  # Placeholder that reports success when guardrails are skipped.
  # Required because "Local + CI guardrails" is a required status check —
  # if the real job is skipped, GitHub won't see a passing status and blocks merge.
  guardrails-skip:
    name: Local + CI guardrails
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No source changes detected — skipping guardrails."

  # Tier 2: E2E accessibility gate (axe-core)
  # Uses a lightweight static server instead of wrangler dev (which requires D1 bindings)
  e2e-accessibility:
    name: E2E accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build CSS
        run: pnpm run build:css

      # Serve static assets on :8787 — no D1/KV bindings needed for a11y scans
      - name: Start static file server
        run: npx serve public -l 8787 &

      - name: Wait for server
        run: npx wait-on http://localhost:8787 --timeout 30000

      - name: Run accessibility tests
        run: pnpm exec playwright test tests/e2e/frontend/accessibility.spec.ts
        env:
          TEST_URL: http://localhost:8787
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8787

  # Placeholder for E2E accessibility when skipped
  e2e-accessibility-skip:
    name: E2E accessibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'false' && github.event_name == 'pull_request'
    steps:
      - run: echo "No UI changes detected — skipping E2E accessibility."
