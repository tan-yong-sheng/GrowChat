[extend]
useDefault = true

[[allowlists]]
description = "Allow test fixtures, skill docs, and scripts with mock secrets only"
paths = [
  'tests/e2e/fixtures/.*',
  '\.claude/skills/api-design/SKILL\.md',
  'src/routers/auth\.test\.js',
  'scripts/backend_smoke_matrix\.sh',
  'scripts/secret-scan\.cjs'
]

[[allowlists]]
description = "Exclude build artifacts, caches, and tooling state"
paths = [
  '\.wrangler/.*',
  '\.gitnexus/.*',
  '\.pnpm-store/.*',
  'node_modules/.*',
  '\.cache/.*',
  'test-results/.*',
  'playwright-report/.*'
]
