[extend]
useDefault = true

[[allowlists]]
description = "Allow test fixtures, skill docs, scripts, and public keys — contain mock secrets only"
paths = [
  'public/.*',
  'tests/e2e/fixtures/.*',
  '\.claude/skills/.*',
  'src/routers/auth\.test\.js',
  'scripts/backend_smoke_matrix\.sh'
]

[secrets]
whitelist = ["scripts/secret-scan.cjs"]
