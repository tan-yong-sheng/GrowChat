<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowChat Auth</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
  <body class="min-h-screen bg-white flex flex-col font-sans">
  <!-- Logo -->
  <div class="p-8">
     <img src="/logo.png" alt="GrowChat" class="w-10 h-10 object-contain" />
  </div>

  <div class="flex-grow flex items-center justify-center -mt-16">
    <div class="w-full max-w-[440px] px-6 flex flex-col items-center">
      <h1 id="auth-title" class="text-[32px] font-semibold mb-8 text-gray-900">Sign in to GrowChat</h1>

      <form id="auth-form" class="w-full space-y-4">
        <!-- Name field for registration -->
        <div id="name-wrap" class="hidden">
           <label class="block text-sm font-medium text-gray-900 mb-1.5" for="name">Name</label>
           <input id="name" placeholder="Enter Your Name" class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-300 transition placeholder:text-gray-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="email">Email</label>
          <input id="email" type="email" placeholder="Enter Your Email" class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-300 transition placeholder:text-gray-400" required />
        </div>

        <div class="relative">
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="password">Password</label>
          <input id="password" type="password" placeholder="Enter Your Password" class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-300 transition placeholder:text-gray-400" required />
        </div>

        <button id="auth-submit" class="w-full bg-[#171717] hover:bg-black text-white font-medium rounded-[20px] py-[14px] mt-4 transition shadow-sm">Sign in</button>
      </form>

      <div class="mt-6 text-sm text-gray-600 flex items-center gap-1.5">
        <span id="toggle-text">Don't have an account?</span>
        <button id="toggle-mode" type="button" class="text-gray-900 font-semibold underline underline-offset-4 decoration-1">Sign up</button>
      </div>

      <p id="auth-error" class="text-sm text-red-600 mt-6 hidden text-center"></p>
    </div>
  </div>

  <script type="module" src="/js/bootstrap/auth.js"></script>
</body>
</html>
