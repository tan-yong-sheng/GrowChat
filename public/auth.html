<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GrowChat Auth</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
  <body class="min-h-screen bg-white flex flex-col font-sans">
  <!-- Logo -->
  <div class="p-8">
     <img src="/logo.png" alt="GrowChat" class="w-10 h-10 object-contain" />
  </div>

  <div class="flex-grow flex items-center justify-center -mt-16">
    <div class="w-full max-w-[440px] px-6 flex flex-col items-center">
      <h1 id="auth-title" class="text-[32px] tracking-[-0.374px] font-semibold mb-8 text-gray-900">Sign in to GrowChat</h1>

      <form id="auth-form" class="w-full space-y-4">
        <!-- Name field for registration -->
        <div id="name-wrap" class="hidden">
           <label class="block text-sm font-medium text-gray-900 mb-1.5" for="name">Name</label>
           <input id="name" autocomplete="name" placeholder="Enter Your Name" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="Enter Your Email" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" required />
        </div>

        <div class="relative">
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter Your Password" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" minlength="8" required />
        </div>

        <button id="auth-submit" class="w-full bg-[#0066cc] hover:bg-[#0071e3] active:scale-95 text-white font-medium rounded-full py-[14px] mt-4 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0071e3]">Sign in</button>
      </form>

      <div class="mt-6 text-sm text-gray-700 flex items-center gap-1.5 justify-center">
        <span id="toggle-text">Don’t have an account?</span>
        <button id="toggle-mode" type="button" class="text-gray-900 font-semibold underline underline-offset-4 decoration-1 py-2 px-1 min-h-[44px] flex items-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">Sign up</button>
      </div>

      <button id="forgot-password" type="button" class="text-sm text-gray-900 hover:text-black underline underline-offset-4 decoration-1 mt-4 py-2 px-1 min-h-[44px] flex items-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">Forgot password?</button>

      <p id="auth-error" class="text-sm text-red-600 mt-6 hidden text-center" aria-live="polite" role="alert"></p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-[18px] p-8 w-full max-w-[440px] mx-6">
      <h2 id="modal-title" class="text-[24px] tracking-[-0.374px] font-semibold mb-2 text-gray-900">Reset your password</h2>
      <p id="modal-subtitle" class="text-sm text-gray-600 mb-6">Enter your email to receive a password reset link</p>

      <form id="forgot-password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="forgot-email">Email</label>
          <input id="forgot-email" type="email" autocomplete="email" placeholder="Enter your email" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" required />
        </div>

        <button id="forgot-submit" type="submit" class="w-full bg-[#0066cc] hover:bg-[#0071e3] active:scale-95 text-white font-medium rounded-full py-[14px] transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0071e3]">Send reset link</button>
      </form>

      <button id="modal-close" type="button" class="w-full text-center text-sm text-gray-900 hover:text-black mt-4 py-3 min-h-[44px] flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">Cancel</button>

      <p id="modal-error" class="text-sm text-red-600 mt-4 hidden text-center" aria-live="polite" role="alert"></p>
      <p id="modal-success" class="text-sm text-green-600 mt-4 hidden text-center" aria-live="polite" role="status"></p>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div id="reset-password-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-[18px] p-8 w-full max-w-[440px] mx-6">
      <h2 class="text-[24px] tracking-[-0.374px] font-semibold mb-2 text-gray-900">Create new password</h2>
      <p class="text-sm text-gray-600 mb-6">Enter your new password below</p>

      <form id="reset-password-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="new-password">New Password</label>
          <input id="new-password" type="password" autocomplete="new-password" placeholder="Enter new password" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-900 mb-1.5" for="confirm-password">Confirm Password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm password" class="w-full px-5 py-3 border border-gray-200 rounded-full focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400" required />
        </div>

        <button id="reset-submit" type="submit" class="w-full bg-[#0066cc] hover:bg-[#0071e3] active:scale-95 text-white font-medium rounded-full py-[14px] transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0071e3]">Reset password</button>
      </form>

      <p id="reset-error" class="text-sm text-red-600 mt-4 hidden text-center" aria-live="polite" role="alert"></p>
      <p id="reset-success" class="text-sm text-green-600 mt-4 hidden text-center" aria-live="polite" role="status"></p>
    </div>
  </div>

  <script type="module" src="/js/bootstrap/auth.js"></script>
</body>
</html>
