<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrowChat Auth</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Add Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        font-family: 'Inter', 'Archivo', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-white flex flex-col font-sans">
    <!-- Logo -->
    <div class="p-8">
      <img src="/logo.png" alt="GrowChat" class="w-10 h-10 object-contain" />
    </div>

    <div class="flex-grow flex items-center justify-center -mt-16">
      <div class="w-full max-w-[440px] px-6 flex flex-col items-center">
        <h1 id="auth-title" class="text-[32px] font-semibold mb-8 text-gray-900">
          Sign in to GrowChat
        </h1>

      <!-- Google OAuth button (shown only when Google OAuth is configured) -->
      <div id="google-oauth-wrap" class="w-full hidden">
        <button
          id="google-signin-btn"
          type="button"
          class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-[20px] py-[14px] transition shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign in with Google
        </button>
        <!-- Divider -->
        <div class="flex items-center my-5">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="px-3 text-sm text-gray-400">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>
      </div>

        <form id="auth-form" method="POST" action="#" class="w-full space-y-4">
          <!-- Name field for registration -->
          <div id="name-wrap" class="hidden">
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="name">Name</label>
            <input
              id="name"
              autocomplete="name"
              placeholder="Enter Your Name"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              placeholder="Enter Your Email"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
              required
            />
          </div>

          <div class="relative">
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="password"
              >Password</label
            >
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter Your Password"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
              minlength="8"
              required
            />
          </div>

          <button
            id="auth-submit"
            class="w-full bg-[#0066cc] hover:bg-blue-700 text-white font-medium rounded-[20px] py-[14px] mt-4 transition shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0066cc]"
          >
            Sign in
          </button>
        </form>

        <div class="mt-6 text-sm text-gray-700 flex items-center gap-1.5 justify-center">
          <span id="toggle-text">Don’t have an account?</span>
          <button
            id="toggle-mode"
            type="button"
            class="text-gray-900 font-semibold underline underline-offset-4 decoration-1 py-2 px-1 min-h-[44px] flex items-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
          >
            Sign up
          </button>
        </div>

        <button
          id="forgot-password"
          type="button"
          class="text-sm text-gray-900 hover:text-black underline underline-offset-4 decoration-1 mt-4 py-2 px-1 min-h-[44px] flex items-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
        >
          Forgot password?
        </button>

        <p
          id="auth-error"
          class="text-sm text-red-600 mt-6 hidden text-center"
          aria-live="polite"
          role="alert"
        ></p>
      </div>
    </div>

    <!-- Forgot Password Modal -->
    <div
      id="forgot-password-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-[20px] p-8 w-full max-w-[440px] mx-6">
        <h2 id="modal-title" class="text-[24px] font-semibold mb-2 text-gray-900">
          Reset your password
        </h2>
        <p id="modal-subtitle" class="text-sm text-gray-600 mb-6">
          Enter your email to receive a password reset link
        </p>

        <form id="forgot-password-form" method="POST" action="#" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="forgot-email"
              >Email</label
            >
            <input
              id="forgot-email"
              type="email"
              autocomplete="email"
              placeholder="Enter your email"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
              required
            />
          </div>

          <button
            id="forgot-submit"
            type="submit"
            class="w-full bg-[#0066cc] hover:bg-blue-700 text-white font-medium rounded-[20px] py-[14px] transition shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0066cc]"
          >
            Send reset link
          </button>
        </form>

        <button
          id="modal-close"
          type="button"
          class="w-full text-center text-sm text-gray-900 hover:text-black mt-4 py-3 min-h-[44px] flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
        >
          Cancel
        </button>

        <p
          id="modal-error"
          class="text-sm text-red-600 mt-4 hidden text-center"
          aria-live="polite"
          role="alert"
        ></p>
        <p
          id="modal-success"
          class="text-sm text-green-600 mt-4 hidden text-center"
          aria-live="polite"
          role="status"
        ></p>
      </div>
    </div>

    <!-- Reset Password Modal -->
    <div
      id="reset-password-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-[20px] p-8 w-full max-w-[440px] mx-6">
        <h2 class="text-[24px] font-semibold mb-2 text-gray-900">Create new password</h2>
        <p class="text-sm text-gray-600 mb-6">Enter your new password below</p>

        <form id="reset-password-form" method="POST" action="#" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="new-password"
              >New Password</label
            >
            <input
              id="new-password"
              type="password"
              autocomplete="new-password"
              placeholder="Enter new password"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-900 mb-1.5" for="confirm-password"
              >Confirm Password</label
            >
            <input
              id="confirm-password"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm password"
              class="w-full px-5 py-3 border border-gray-200 rounded-[20px] focus:outline-none focus:ring-1 focus:ring-gray-500 transition placeholder:text-gray-400"
              required
            />
          </div>

          <button
            id="reset-submit"
            type="submit"
            class="w-full bg-[#0066cc] hover:bg-blue-700 text-white font-medium rounded-[20px] py-[14px] transition shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0066cc]"
          >
            Reset password
          </button>
        </form>

        <p
          id="reset-error"
          class="text-sm text-red-600 mt-4 hidden text-center"
          aria-live="polite"
          role="alert"
        ></p>
        <p
          id="reset-success"
          class="text-sm text-green-600 mt-4 hidden text-center"
          aria-live="polite"
          role="status"
        ></p>
      </div>
    </div>

    <script type="module" src="/js/bootstrap/auth.js"></script>
  </body>
</html>
