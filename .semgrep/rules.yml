rules:
  - id: no-inline-style-attributes-in-feature-code
    pattern-regex: 'style\s*=\s*["\x27`]'
    paths:
      include:
        - '**/public/js/features/**/*'
    message: 'Inline style attributes bypass Tailwind guardrails. Use utility classes instead.'
    severity: ERROR
    languages:
      - javascript

  - id: no-ad-hoc-media-queries-in-feature-code
    pattern-regex: '@media\s*\('
    paths:
      include:
        - '**/public/js/features/**/*'
        - '**/src/features/**/*'
    message: 'Custom media queries in feature code bypass Tailwind responsive prefixes.'
    severity: ERROR
    languages:
      - javascript

  - id: no-frontend-worker-env-access
    pattern-regex: 'env\.(DB|CACHE|SESSIONS|CHAT_SESSIONS)'
    paths:
      include:
        - '**/public/js/**/*'
    message: 'Browser code must not touch worker env bindings. Keep D1/KV access server-side.'
    severity: ERROR
    languages:
      - javascript

  - id: no-raw-pill-button-markup-in-feature-code
    pattern-regex: '<button[^>]*class\s*=\s*["\x27`](?=[^"\x27`]*rounded-full)(?=[^"\x27`]*\bpx-[^\s"\x27`]+)(?=[^"\x27`]*\bpy-[^\s"\x27`]+)[^"\x27`]*["\x27`]'
    paths:
      include:
        - '**/public/js/**/*'
      exclude:
        - '**/public/js/shared/components/button.js'
        - '**/public/js/features/chat/model-selector.js' # dropdown trigger with custom inner HTML; renderButton() cannot produce chevron+label combo
        - '**/*.test.js'
        - '**/*.spec.js'
    message: 'Raw pill button markup bypasses canonical button primitive. Use renderButton() instead.'
    severity: ERROR
    languages:
      - javascript

  - id: no-raw-status-badge-markup-in-account-features
    pattern-regex: '<span[^>]*class\s*=\s*["\x27`][^"\x27`]*inline-flex items-center rounded-full border px-2 py-0\.5 text-\[10px\] font-semibold uppercase tracking-wide[^"\x27`]*["\x27`]'
    paths:
      include:
        - '**/public/js/features/account/account-connections.js'
        - '**/public/js/features/account/account-integrations.js'
      exclude:
        - '**/public/js/shared/components/status-badge.js'
        - '**/*.test.js'
        - '**/*.spec.js'
    message: 'Raw status badge markup in account feature code bypasses renderStatusBadge(). Use shared status badge component.'
    severity: ERROR
    languages:
      - javascript

  - id: no-raw-model-access-badge-markup-in-model-settings-features
    pattern-regex: '<span[^>]*data-model-access\s*=\s*["\x27`][^"\x27`]+["\x27`][^>]*class\s*=\s*["\x27`][^"\x27`]*inline-flex items-center rounded-full border px-2 py-0\.5 text-\[10px\] font-semibold uppercase tracking-wide[^"\x27`]*["\x27`]'
    paths:
      include:
        - '**/public/js/features/account/account-models.js'
        - '**/public/js/features/admin/settings/models.js'
      exclude:
        - '**/public/js/shared/components/model-access-badge.js'
        - '**/*.test.js'
        - '**/*.spec.js'
    message: 'Raw model access badge markup bypasses renderModelAccessBadgeForModel(). Use shared model access badge component.'
    severity: ERROR
    languages:
      - javascript

  - id: no-direct-model-access-presentation-in-model-settings-features
    pattern-regex: 'getModelAccessPresentation\s*\('
    paths:
      include:
        - '**/public/js/features/account/account-models.js'
        - '**/public/js/features/admin/settings/models.js'
      exclude:
        - '**/public/js/shared/components/model-access-badge.js'
        - '**/*.test.js'
        - '**/*.spec.js'
    message: 'Do not call getModelAccessPresentation() directly in model settings feature pages. Use renderModelAccessBadgeForModel() component helper.'
    severity: ERROR
    languages:
      - javascript

  - id: no-inline-role-checks-in-routers
    pattern-either:
      - pattern: if ($USER.primary_role === 'admin') { $$$BODY }
      - pattern: if ($USER.primary_role === "admin") { $$$BODY }
      - pattern: if ($ROLES.includes($USER.primary_role)) { $$$BODY }
      - pattern: if ($ROLES.includes($USER?.primary_role)) { $$$BODY }
    paths:
      include:
        - '**/src/routers/**/*.js'
      exclude:
        - '**/src/utils/role-policy.js'
        - '**/src/utils/admin.js'
        - '**/src/utils/rbac.js'
        - '**/*.test.js'
        - '**/*.spec.js'
    message: 'Routers must not embed role checks. Use role-policy helpers or authorize().'
    severity: ERROR
    languages:
      - javascript
