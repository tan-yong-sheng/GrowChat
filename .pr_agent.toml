[config]
model = "openai/opencode/deepseek-v4-flash"
fallback_models = ["openai/kilo/step-3.7-flash"]
# custom_model_max_tokens must be set because neither model is in
# PR-Agent's built-in MAX_TOKENS dict.
# Without this, get_max_tokens() raises in pr_agent/algo/utils.py:1008.
# Value: 1M tokens (matches deepseek/deepseek-v4-flash's entry at line 72).
custom_model_max_tokens = 1000000

[github_action_config]
# Override the default PR actions to include 'synchronize' (new commits pushed).
# The default in pr-agent's bundled configuration.toml is:
#   ["opened", "reopened", "ready_for_review", "review_requested"]
# which silently skips the 'synchronize' event. See pr_agent/servers/github_action_runner.py:114
pr_actions = ["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]

[pr_reviewer]
# Run review automatically on every PR event (opened, synchronize, etc.)
auto_review = true

[pr_description]
# Also auto-generate/update description on sync
enable_pr_type = true