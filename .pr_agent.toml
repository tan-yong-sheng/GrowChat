[config]
model = "openai/opencode/deepseek-v4-flash"
fallback_models = ["openai/kilo/step-3.7-flash"]
# custom_model_max_tokens must be set because neither model is in
# PR-Agent's built-in MAX_TOKENS dict.
# Without this, get_max_tokens() raises in pr_agent/algo/utils.py:1008.
# Value: 1M tokens (matches deepseek/deepseek-v4-flash's entry at line 72).
custom_model_max_tokens = 1000000

[github_action_config]
# Override the default PR actions to include 'synchronize' (new commits pushed).
# The default in pr-agent's bundled configuration.toml is:
#   ["opened", "reopened", "ready_for_review", "review_requested"]
# which silently skips the 'synchronize' event. See pr_agent/servers/github_action_runner.py:114
pr_actions = ["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]

[pr_reviewer]
# Run review automatically on every PR event (opened, synchronize, etc.)
auto_review = true

# Surface security labels in review output
enable_review_labels_security = true

# Check if PR actually addresses linked tickets (extracted from branch/description)
require_ticket_analysis_review = true

# Estimate effort to review (time cost) — shown as a score in the output header
require_estimate_effort_to_review = true

# Estimate contribution time cost (how long the change took to write)
require_estimate_contribution_time_cost = true

[pr_code_suggestions]
# Push inline ``suggestion`` blocks on PR Files Changed tab
# so you can apply changes with one click from GitHub
commitable_code_suggestions = true

# On top of inline suggestions, also publish the summary table
# to get the score overview, reasoning (score_why), and category labels
# Threshold: score >= 1 means all non-stale suggestions get both outputs
dual_publishing_score_threshold = 1

[pr_description]
# Also auto-generate/update description on sync
enable_pr_type = true

# Publish auto-labels on PR (bug fix, enhancement, security, etc.)
publish_labels = true

# Generate AI title from PR content (override PR title if it's a draft)
generate_ai_title = true